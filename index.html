<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCSE Computer Science Exam Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <div id="progress-wrapper" class="hidden">
            <div id="progress-bar"></div>
        </div>

        <div id="header-info">
            <div id="stats-display">
                <div id="level-display">LVL 1 (F)</div>
                <div id="xp-bar-container">
                    <div id="xp-bar-fill"></div>
                </div>
            </div>
            
            <div id="streak-display"></div>
            <div id="score-display">Score: 0</div>
            <div id="timer-display"></div>
        </div>

        <div id="rank-up-overlay" class="hidden">
            <div id="terminal-box">
                <span id="terminal-text"></span><span class="cursor">_</span>
            </div>
        </div>

        <div id="main-menu" class="fade-in">
            <h1>GCSE COMP SCI TRAINER</h1>

            <div class="top-action-grid">
                <div class="mock-section">
                    <button class="mock-btn p1-btn" onclick="startSession('MOCK_P1')">PAPER 1 MOCK (30 Qs)</button>
                    <button class="mock-btn p2-btn" onclick="startSession('MOCK_P2')">PAPER 2 MOCK (30 Qs)</button>
                </div>

                <div class="game-section">
                    <button class="special-btn boss-btn" onclick="showBossDifficulty()">🔥 BINARY BOSS BATTLE</button>
                    <button class="special-btn sim-btn" onclick="startLogicSimulator()">🔌 LOGIC GATE LAB</button>
                    <button class="special-btn p2-btn" onclick="showWallMenu()">🧩 CONNECTING WALLS</button>
                </div>
            </div>

            <h2 style="color: #1abc9c;">PAPER 1: COMPUTATIONAL THINKING</h2>
            <div id="topic-grid-p1" class="topic-grid"></div>

            <h2 style="color: #3483bb; margin-top: 20px;">PAPER 2: COMPUTING CONCEPTS</h2>
            <div id="topic-grid-p2" class="topic-grid"></div>
        </div>

        <div id="wall-selection-menu" class="hidden fade-in">
            <h1>SELECT A WALL</h1>
            <div class="topic-grid">
                <button class="topic-card p1-card" onclick="startConnectingWall('3.1')">3.1 ALGORITHMS</button>
                <button class="topic-card p1-card" onclick="startConnectingWall('3.2')">3.2 PROGRAMMING</button>
                <button class="topic-card p2-card" onclick="startConnectingWall('3.3')">3.3 DATA REP</button>
                <button class="topic-card p1-card" onclick="startConnectingWall('3.4')">3.4 COMPUTER SYSTEMS</button>
                <button class="topic-card p2-card" onclick="startConnectingWall('3.5')">3.5 NETWORKS</button>
                <button class="topic-card p2-card" onclick="startConnectingWall('3.6')">3.6 CYBER SECURITY</button>
                <button class="topic-card p2-card" onclick="startConnectingWall('3.7')">3.7 DATABASES & SQL</button>
                <button class="topic-card p2-card" onclick="startConnectingWall('3.8')">3.8 ETHICAL & LEGAL</button>


            </div>
            <h2 style="color: #ecf0f1; margin-top: 30px;">FULL PAPER MIXES</h2>
            <div class="topic-grid">
                <button class="topic-card p1-card" onclick="startConnectingWall('PAPER_1')">PAPER 1 MIX</button>
                <button class="topic-card p2-card" onclick="startConnectingWall('PAPER_2')">PAPER 2 MIX</button>
            </div>
            <button class="leave-btn" style="margin-top:20px" onclick="showMenu()">CANCEL</button>
        </div>

        <div id="wall-area" class="hidden">
            <div id="wall-topic-display"></div>
            <div id="wall-grid" class="wall-grid"></div>
            <div id="wall-feedback" class="wall-feedback"></div>
            <div id="wall-solved-categories"></div>
            <div id="nav-controls">
                <button class="leave-btn" onclick="showMenu()">BACK TO MENU</button>
            </div>
        </div>

        <div id="quiz-area" class="hidden">
            <div id="topic-display"></div>
            <div id="boss-ui" class="hidden">
                <div id="boss-health-bg">
                    <div id="boss-health-fill"></div>
                </div>
                <div id="boss-hp-text">100/100 HP</div>
            </div>
            <h2 id="question-text"></h2>
            <div id="options-container"></div>
            <div id="logic-sim-area" class="hidden"></div>
            <div id="feedback-area"></div>
            <div id="nav-controls">
                <button class="leave-btn" onclick="showMenu()">LEAVE TOPIC</button>
                <button id="hint-btn" onclick="showHint()">NEED A HINT?</button>
                <button id="continue-btn" class="hidden" onclick="nextQuestion()">CONTINUE</button>
            </div>
        </div>

        <div id="boss-difficulty-menu" class="hidden fade-in">
            <h3>SELECT INTENSITY</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <button class="mock-btn p1-btn" onclick="startBossBattle('EASY')">EASY</button>
                <button class="mock-btn p2-btn" onclick="startBossBattle('MEDIUM')">MEDIUM</button>
                <button class="mock-btn boss-btn" onclick="startBossBattle('HARD')">HARD</button>
            </div>
            <button class="leave-btn" style="margin-top: 15px;" onclick="showMenu()">CANCEL</button>
        </div>

        <div id="results-area" class="hidden">
            <h1>SESSION COMPLETE</h1>
            <p id="final-score-text"></p>
            <div id="rank-display"></div>
            <button class="mock-btn p1-btn" onclick="showMenu()">RETURN TO MAIN MENU</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
